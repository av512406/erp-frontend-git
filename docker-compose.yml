services:
  app:
    build: .
    # image: sshatru/erp:latest
    container_name: school_erp_app
    # ports:
    #   - "5000:5000" # Exposed via Nginx now
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_SECURE=false
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - TZ=${TZ}
    links:
      - postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: school_erp_nginx
    ports:
      - "80:80"
      - "443:443" # Open HTTPS port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    links:
      - app
    restart: always

  postgres:
    image: postgres:16
    container_name: school_erp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: school_erp_backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - BACKUP_FREQUENCY_SECONDS=86400 # 24 hours
      - TZ=Asia/Kolkata
    volumes:
      - ./db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres

  certbot:
    image: certbot/certbot
    container_name: school_erp_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - nginx
    links:
      - nginx

volumes:
  postgres_data:
    name: school_erp_postgres_data
  certbot_conf:
    name: school_erp_certbot_conf
  certbot_www:
    name: school_erp_certbot_www