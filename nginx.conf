events {
    worker_connections 1024;
}

http {
    # HTTP - Redirect to HTTPS
    server {
        listen 80;
        server_name erp.edulekha.in localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # Redirect to HTTPS
            return 301 https://$host$request_uri;
            
            # For now, just proxy (HTTP mode)
            # proxy_pass http://app:5000;
            # proxy_http_version 1.1;
            # proxy_set_header Upgrade $http_upgrade;
            # proxy_set_header Connection 'upgrade';
            # proxy_set_header Host $host;
            # proxy_cache_bypass $http_upgrade;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name erp.edulekha.in;

        ssl_certificate /etc/letsencrypt/live/erp.edulekha.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/erp.edulekha.in/privkey.pem;

        location / {
            proxy_pass http://app:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
